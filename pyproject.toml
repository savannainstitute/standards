[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "savannainstitute-standards"
version = "1.0.0"
description = "The Savanna Institute's shared code checks, linter settings and project templates"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "ruff==0.17.0",
    "pytest==9.1.1",
    "yamllint==1.38.0",
    "pyyaml==6.0.3",
]

[project.scripts]
slop-check = "standards.slop_check:main"
render-rules = "standards.render_rules:main"
standards-ruff = "standards.tools:main_ruff"
standards-yamllint = "standards.tools:main_yamllint"
standards-config = "standards.tools:main_config"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
standards = ["configs/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
