[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "savannainstitute-standards"
version = "1.1.0"
description = "The Savanna Institute's shared code checks, linter settings and project templates"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "ruff==0.17.0",
    "pytest==9.1.1",
    "yamllint==1.38.0",
    "pyyaml==6.0.3",
    "coverage==7.16.2",
]

[project.scripts]
rules-check = "standards.rules_check:main"
render-rules = "standards.render_rules:main"
render-agent = "standards.render_agent:main"
coverage-gate = "standards.coverage_gate:main"
standards-ruff = "standards.tools:main_ruff"
standards-yamllint = "standards.tools:main_yamllint"
standards-config = "standards.tools:main_config"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
standards = ["configs/*", "agent/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
