exempt:
  - path: src/standards/rules.py
    rules:
      - chat-residue
      - machine-path
      - silent-default
      - silent-row-drop
      - silenced-check
    reason: the rule examples in this file are the shapes those rules look for
  - path: src/standards/rules_check.py
    rules: [machine-path, silenced-check]
    reason: the patterns those rules look for are defined on this file's lines
  - path: .github/workflows/checks.yml
    rules: [standards-copy]
    reason: this repository holds the shared workflow under that name and calls it from self-checks.yml
  - path: .pre-commit-config.yaml
    rules: [standards-copy]
    reason: this repository runs its hooks from the working copy, so it pins no released version
