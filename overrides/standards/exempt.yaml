exempt:
  - path: src/standards/rules.py
    rules:
      - chat-residue
      - machine-path
      - silent-default
      - silent-row-drop
      - silenced-check
    reason: the rule examples in this file are the shapes those rules look for
  - path: src/standards/rules_check.py
    rules: [machine-path, silenced-check]
    reason: the patterns those rules look for are defined on this file's lines
  - path: .github/workflows/checks.yml
    rules: [standards-copy]
    reason: this repository holds the shared workflow under that name; self-checks.yml calls it
  - path: tests/fixtures/planted_a.json
    rules: [decision-attribution]
    reason: the planted example of that rule is plain ASCII, so escaping cannot hide it
  - path: src/standards/configs/vitest-needs-reporter.mjs
    rules: [untested-code]
    reason: this repository has no Node project to run a vitest test of its own reporter
  - path: .pre-commit-config.yaml
    rules: [standards-copy]
    reason: this repository runs its hooks from the working copy, so it pins no commit
