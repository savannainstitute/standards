# This repository checks itself with its own hooks from the working copy.
repos:
  - repo: local
    hooks:
      - id: rules-check
        name: rules in the rule list
        entry: rules-check --repo savannainstitute/standards --standards-root .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff check
        entry: standards-ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: standards-ruff format
        language: system
        types_or: [python, pyi]
      - id: yamllint
        name: yamllint
        entry: standards-yamllint
        language: system
        types: [yaml]
      - id: render-rules
        name: docs/RULES.md is current
        entry: render-rules --check
        language: system
        pass_filenames: false
        always_run: true
      - id: render-agent
        name: the agent files are current
        entry: render-agent --check
        language: system
        pass_filenames: false
        always_run: true
