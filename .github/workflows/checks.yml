name: checks

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Label of a private repository's own machine. Public repositories
          always run on GitHub's Linux runner, which costs them nothing.
        type: string
        required: false
        default: ubuntu-latest

jobs:
  lint:
    runs-on: ${{ (github.event.repository.private && inputs.runner) || 'ubuntu-latest' }}
    outputs:
      conda: ${{ steps.python-tests.outputs.conda }}
    steps:
      - name: Check out the repository under test
        uses: actions/checkout@v7
        with:
          path: repo
          fetch-depth: 0

      - name: Check out the standards at the version this workflow was called at
        uses: actions/checkout@v7
        with:
          repository: savannainstitute/standards
          ref: ${{ job.workflow_sha }}
          path: standards

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the standards package, which pins every tool
        id: standards
        run: python -m pip install --quiet ./standards

      # Every check below runs after another fails, so one push reports every finding.
      - name: Install gitleaks
        id: gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "$RELEASES/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
        env:
          RELEASES: https://github.com/gitleaks/gitleaks/releases/download
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

      - name: Secrets anywhere in the history
        if: ${{ !cancelled() && steps.gitleaks.outcome == 'success' }}
        working-directory: repo
        run: ../gitleaks git --config "$(standards-config gitleaks.toml)" --redact --no-banner .

      - name: Dockerfiles
        if: ${{ !cancelled() && steps.standards.outcome == 'success' }}
        working-directory: repo
        env:
          RELEASES: https://github.com/hadolint/hadolint/releases/download
          VERSION: 2.15.1
          SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
        run: |
          dockerfiles="$(git ls-files -- '*Dockerfile*' '*Containerfile*')"
          if [ -n "$dockerfiles" ]; then
            curl -sSL -o ../hadolint "$RELEASES/v$VERSION/hadolint-linux-x86_64"
            echo "$SHA256  ../hadolint" | sha256sum -c -
            chmod +x ../hadolint
            # shellcheck disable=SC2086 # one argument per tracked Dockerfile
            ../hadolint --config "$(standards-config hadolint.yaml)" $dockerfiles
          fi

      - name: Python lint and format
        if: ${{ !cancelled() && steps.standards.outcome == 'success' }}
        working-directory: repo
        run: |
          if git ls-files -- '*.py' | grep -q .; then
            ruff check --config "$(standards-config ruff.toml)" .
            ruff format --check --config "$(standards-config ruff.toml)" .
          fi

      - name: YAML
        if: ${{ !cancelled() && steps.standards.outcome == 'success' }}
        working-directory: repo
        run: yamllint -c "$(standards-config yamllint.yaml)" .

      - name: Rules in the rule list
        if: ${{ !cancelled() && steps.standards.outcome == 'success' }}
        working-directory: repo
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s' "$PR_BODY" > ../pr_body.txt
          rules-check --base "$BASE" --head "$HEAD" --pr-body ../pr_body.txt \
            --repo "$GITHUB_REPOSITORY" --standards-root ../standards

      - uses: actions/setup-node@v7
        id: node
        if: ${{ !cancelled() }}
        with:
          node-version: "24"

      # Tools are called by full path under this folder, never through a script in the repository.
      - name: Install the Node tools at the versions the standards pin
        id: node-tools
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: |
          npm ci --prefix standards/src/standards/configs
          echo "STANDARDS_NODE=$GITHUB_WORKSPACE/standards/src/standards/configs" >> "$GITHUB_ENV"

      - name: Markdown
        if: ${{ !cancelled() && steps.node-tools.outcome == 'success' }}
        working-directory: repo
        run: |
          if git ls-files -- '.markdownlint*' '*/.markdownlint*' | grep .; then
            echo "Remove the files above: the Markdown settings live in the standards repository."
            exit 1
          fi
          if git ls-files -- '*.md' | grep -q .; then
            "$STANDARDS_NODE/node_modules/.bin/markdownlint-cli2" \
              --config "$STANDARDS_NODE/markdownlint-cli2.jsonc" "**/*.md"
          fi

      - name: Install the repository's packages
        id: packages
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        working-directory: repo
        run: |
          if [ -f package.json ]; then
            npm ci
          fi

      - name: JavaScript and TypeScript lint
        if: >-
          ${{ !cancelled() && steps.node-tools.outcome == 'success'
          && steps.packages.outcome == 'success' }}
        working-directory: repo
        run: |
          if [ -f package.json ]; then
            "$STANDARDS_NODE/node_modules/.bin/eslint" \
              --config "$STANDARDS_NODE/eslint.config.mjs" .
          fi

      - name: JavaScript and TypeScript format
        if: >-
          ${{ !cancelled() && steps.node-tools.outcome == 'success'
          && steps.packages.outcome == 'success' }}
        working-directory: repo
        run: |
          if [ -f package.json ]; then
            "$STANDARDS_NODE/node_modules/.bin/prettier" \
              --config "$STANDARDS_NODE/prettierrc.yaml" --no-editorconfig \
              --ignore-path .gitignore --check \
              "**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,css,html}"
          fi

      - name: Types
        if: >-
          ${{ !cancelled() && steps.node-tools.outcome == 'success'
          && steps.packages.outcome == 'success' }}
        working-directory: repo
        run: |
          if [ -f package.json ]; then
            "$STANDARDS_NODE/node_modules/.bin/tsc" --noEmit -p .
          fi

      - name: JavaScript and TypeScript tests
        id: js-tests
        if: >-
          ${{ !cancelled() && steps.node-tools.outcome == 'success'
          && steps.packages.outcome == 'success' }}
        working-directory: repo
        env:
          STANDARDS_NO_NEEDS: "true"
        run: |
          if [ -f package.json ]; then
            "$STANDARDS_NODE/node_modules/.bin/vitest" run --reporter=default \
              --reporter="$STANDARDS_NODE/vitest-needs-reporter.mjs" \
              --coverage.enabled --coverage.provider=v8 --coverage.reporter=text \
              --coverage.reporter=cobertura --coverage.reportsDirectory=../coverage/js \
              --coverage.include='src/**'
          fi

      - name: Python tests
        id: python-tests
        if: ${{ !cancelled() && steps.standards.outcome == 'success' }}
        working-directory: repo
        run: |
          if [ -f environment.yml ] && [ -d tests ]; then
            echo "conda=true" >> "$GITHUB_OUTPUT"
          elif git ls-files -- 'tests/*.py' | grep -q .; then
            if [ -f pyproject.toml ]; then
              python -m pip install --quiet -e .
            fi
            pytest_args="-p standards.pytest_needs --no-needs --strict-markers tests"
            if git ls-files -- '*.py' | grep -v -E '(^|/)(tests/|\.)' | grep -q .; then
              # shellcheck disable=SC2086 # pytest_args is several words on purpose
              python -m coverage run --source=. --omit='tests/*,*/tests/*,.*/*,*/.*/*' \
                -m pytest $pytest_args
              python -m coverage report --skip-empty
              python -m coverage xml -q -o ../coverage/python.xml
            else
              # shellcheck disable=SC2086 # pytest_args is several words on purpose
              python -m pytest $pytest_args
            fi
          fi

      # Coverage needs both test steps to have finished, or a report would be missing.
      - name: Test coverage against the floor
        if: >-
          ${{ !cancelled() && steps.python-tests.outcome == 'success'
          && steps.js-tests.outcome == 'success' }}
        working-directory: repo
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          coverage-gate --report ../coverage/python.xml \
            --report ../coverage/js/cobertura-coverage.xml \
            --base "$BASE" --head "$HEAD" --repo "$GITHUB_REPOSITORY" \
            --standards-root ../standards

      - name: Find the R files and how the repository declares its R packages
        id: r
        if: ${{ !cancelled() }}
        working-directory: repo
        env:
          VERSION_FIELD: 's/^(Config\/roxygen2\/version|RoxygenNote): *//p'
        run: |
          if ! git ls-files -- '*.R' '*.r' '*.Rmd' | grep -q .; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          if [ -f DESCRIPTION ]; then
            roxygen="$(sed -n -E "$VERSION_FIELD" DESCRIPTION | head -n 1)"
            if [ -z "$roxygen" ]; then
              echo "DESCRIPTION records no roxygen2 version; run roxygen2::roxygenise(), commit."
              exit 1
            fi
            echo "kind=package" >> "$GITHUB_OUTPUT"
            echo "roxygen=$roxygen" >> "$GITHUB_OUTPUT"
          elif [ -f renv.lock ]; then
            echo "kind=renv" >> "$GITHUB_OUTPUT"
          else
            echo "kind=plain" >> "$GITHUB_OUTPUT"
            echo "No DESCRIPTION and no renv.lock: no packages are installed for this repository."
          fi

      - name: Set up R, at the version renv.lock records when there is one
        id: r-setup
        if: ${{ !cancelled() && steps.r.outputs.found == 'true' }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.r.outputs.kind == 'renv' && 'renv' || 'release' }}
          working-directory: repo
          use-public-rspm: true

      - name: Install what DESCRIPTION declares, the package itself and the check's tools
        id: r-deps
        if: >-
          ${{ !cancelled() && steps.r-setup.outcome == 'success'
          && steps.r.outputs.kind == 'package' }}
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: repo
          extra-packages: |
            any::lintr
            any::pkgload
            any::testthat
            roxygen2@${{ steps.r.outputs.roxygen }}
            local::.

      - name: Install the packages renv.lock records
        id: r-renv
        if: >-
          ${{ !cancelled() && steps.r-setup.outcome == 'success'
          && steps.r.outputs.kind == 'renv' }}
        uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: repo

      # Outside repo/ so the repository's renv library stays exactly as renv.lock has it.
      - name: Install the check's tools in a library of their own
        id: r-tools
        if: >-
          ${{ !cancelled() && steps.r-setup.outcome == 'success'
          && (steps.r.outputs.kind == 'renv' || steps.r.outputs.kind == 'plain') }}
        working-directory: ${{ runner.temp }}
        env:
          STANDARDS_R_LIB: ${{ runner.temp }}/standards-r-lib
        run: |
          mkdir -p "$STANDARDS_R_LIB"
          Rscript -e 'install.packages(c("lintr", "testthat"), lib = Sys.getenv("STANDARDS_R_LIB"))'

      - name: Install Air
        id: air
        if: ${{ !cancelled() && steps.r.outputs.found == 'true' }}
        uses: posit-dev/setup-air@v1
        with:
          version: "0.12.0"

      # Air takes no settings path, so the central file replaces any the repository carries.
      - name: R format
        if: ${{ !cancelled() && steps.air.outcome == 'success' }}
        working-directory: repo
        run: |
          find . \( -name air.toml -o -name .air.toml \) -not -path './.git/*' -delete
          cp ../standards/src/standards/configs/air.toml air.toml
          status=0
          air format . --check || status=$?
          rm air.toml
          git checkout --quiet -- .
          exit "$status"

      # Skipped installs are fine here; only one that ran and failed leaves R without its packages.
      - name: R lint
        if: >-
          ${{ !cancelled() && steps.r-setup.outcome == 'success'
          && steps.r-deps.outcome != 'failure' && steps.r-renv.outcome != 'failure'
          && steps.r-tools.outcome != 'failure' }}
        working-directory: repo
        env:
          STANDARDS_R_LIB: ${{ runner.temp }}/standards-r-lib
        run: Rscript ../standards/src/standards/r/run_lintr.R .

      - name: R tests
        if: >-
          ${{ !cancelled() && steps.r-setup.outcome == 'success'
          && steps.r-deps.outcome != 'failure' && steps.r-renv.outcome != 'failure'
          && steps.r-tools.outcome != 'failure' }}
        working-directory: repo
        env:
          STANDARDS_NO_NEEDS: "true"
          STANDARDS_R_LIB: ${{ runner.temp }}/standards-r-lib
        run: |
          if [ -d tests/testthat ]; then
            Rscript ../standards/src/standards/r/run_tests.R .
          fi

      - name: R help pages match the code
        if: ${{ !cancelled() && steps.r-deps.outcome == 'success' }}
        working-directory: repo
        run: Rscript ../standards/src/standards/r/roxygen_drift.R .

  # Building a conda environment takes minutes, so these tests report beside the lint job.
  conda-tests:
    needs: lint
    if: ${{ !cancelled() && needs.lint.outputs.conda == 'true' }}
    runs-on: ${{ (github.event.repository.private && inputs.runner) || 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Check out the repository under test
        uses: actions/checkout@v7

      - name: Check out the standards at the version this workflow was called at
        uses: actions/checkout@v7
        with:
          repository: savannainstitute/standards
          ref: ${{ job.workflow_sha }}
          path: .standards

      - name: Build the environment the repository declares
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Python tests in that environment
        env:
          PYTHONPATH: .standards/src
        run: python -m pytest -p standards.pytest_needs --no-needs --strict-markers tests
