- id: rules-check
  name: rules in the rule list
  description: Runs the tree rules over the whole repository; the pull request rules run in CI.
  entry: rules-check
  language: python
  pass_filenames: false
  always_run: true

- id: ruff-check
  name: ruff check
  entry: standards-ruff check --fix
  language: python
  types_or: [python, pyi]

- id: ruff-format
  name: ruff format
  entry: standards-ruff format
  language: python
  types_or: [python, pyi]

- id: yamllint
  name: yamllint
  entry: standards-yamllint
  language: python
  types: [yaml]

# The same version and settings as configs/package.json and configs/prettierrc.yaml.
- id: markdown-format
  name: markdown format
  entry: prettier --write --no-config --no-editorconfig --print-width 100 --prose-wrap always
  language: node
  additional_dependencies: ["prettier@3.9.10"]
  types: [markdown]
