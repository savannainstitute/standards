name: checks

on:
  pull_request:

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    uses: savannainstitute/standards/.github/workflows/checks.yml@049d382a82f39372474d45310f682ab6170c0f0c
    with:
      runner: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
